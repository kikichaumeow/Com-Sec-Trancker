name: Daily Supabase backup
on:
  schedule:
    - cron: '0 18 * * *'   # 每日 UTC 18:00 = 香港凌晨 2:00
  workflow_dispatch: {}     # 亦可以喺 GitHub 手動按 Run workflow
permissions:
  contents: write
jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/backup.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      - name: Commit backup
        run: |
          git config user.name "backup-bot"
          git config user.email "backup-bot@users.noreply.github.com"
          git add backups
          git diff --cached --quiet || git commit -m "backup $(date -u +%F)"
          git push
